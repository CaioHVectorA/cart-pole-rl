[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cartpole-sim"
version = "0.1.0"
description = "Simulador físico de alta fidelidade e suíte de treinamento RL (PPO + PBRS) para pêndulo invertido com motor de passo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26.0",
    "pygame>=2.6.0",
    "stable-baselines3>=2.4.0",
    "tensorboard>=2.16.0",
    "torch>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
